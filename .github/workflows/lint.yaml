name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  addon:
    name: Home Assistant app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint app configuration
        uses: frenck/action-addon-linter@v2.21
        with:
          path: ./unifi-camera-voice
